name: SCA Scan
on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read
  id-token: write
  packages: read
  actions: read
  statuses: write
  checks: write
  pull-requests: write

jobs:
  # Scans the repository root so the FOSSA CLI analyses the whole Maven reactor
  # in a single pass. Per-module `fossa.only_path` filters must not be
  # reintroduced: the Maven strategy discovers one project at the root pom, so
  # filtering to a child module directory skips it and uploads nothing.
  sca_scan:
    uses: SolaceDev/solace-public-workflows/.github/workflows/sca-scan-and-guard.yaml@main
    with:
      config_file: '.github/workflow-config.json'
      # solace-integration-test-support-bom is not published to Maven Central and
      # GitHub Packages requires auth, but the source repo is public and tagged.
      # Build and install the BOM the same way build-test.yml does, so the plain
      # `mvn` the FOSSA CLI shells out to can resolve the root pom's import.
      # Without this, dependency:tree errors and FOSSA silently uploads a
      # shallow graph with no transitive dependencies.
      # Cloned outside the workspace so FOSSA does not scan it as its own project.
      setup_actions: '["setup-java"]'
      java_version: '17'
      java_distribution: 'zulu'
      custom_setup_script: |
        sudo apt-get update -qq && sudo apt-get install -y libxml2-utils
        version="$(xmllint --xpath '/*[local-name()="project"]/*[local-name()="properties"]/*[local-name()="solace.integration.test.support.version"]/text()' pom.xml)"
        echo "Installing solace-integration-test-support ${version}"
        git clone --depth 1 --branch "${version}" https://github.com/SolaceDev/solace-integration-test-support.git "${RUNNER_TEMP}/sits"
        mvn -B -q install -f "${RUNNER_TEMP}/sits" -Dchangelist= -DskipTests
    secrets:
      FOSSA_API_KEY: ${{ secrets.FOSSA_API_KEY }}

  update_manifest:
    needs: sca_scan
    if: needs.sca_scan.result == 'success' && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      packages: read
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: arn:aws:iam::868978040651:role/github-solace-cloud-manifest-rw
          aws-region: us-east-1

      - name: Update solace-cloud-manifest
        uses: SolaceDev/solace-public-workflows/.github/actions/cicd-helper@main
        with:
          rc_step: add_item_from_json_to_dynamodb_table
          ddb_table_name: solace-cloud-manifest
          ddb_partition_key: squad
          ddb_sort_key: repository
          ddb_item_to_be_added: |
            {
              "squad": "connectors-core",
              "repository": "solace-spring-boot",
              "dev": {
                "sha": "${{ github.sha }}",
                "version": "${{ github.ref_name }}"
              }
            }
