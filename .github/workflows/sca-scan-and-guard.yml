name: SCA Scan
on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read
  id-token: write
  packages: read
  actions: read
  statuses: write
  checks: write
  pull-requests: write

jobs:
  # Scans the repository root so the FOSSA CLI analyses the whole Maven reactor
  # in a single pass. Per-module `fossa.only_path` filters must not be
  # reintroduced: the Maven strategy discovers one project at the root pom, so
  # filtering to a child module directory skips it and uploads nothing.
  sca_scan:
    uses: SolaceDev/solace-public-workflows/.github/workflows/sca-scan-and-guard.yaml@main
    with:
      config_file: '.github/workflow-config.json'
      # The root pom imports com.solace.test.integration:solace-integration-test-support-bom,
      # which is published to GitHub Packages, not Maven Central. The FOSSA CLI
      # shells out to a plain `mvn` that does not read maven/settings.xml, so
      # without credentials in ~/.m2/settings.xml the import POM fails to
      # resolve, `mvn dependency:tree` errors, and FOSSA silently falls back to
      # a shallow graph with no transitive dependencies.
      setup_actions: '["maven-settings"]'
      maven_settings_repositories: '[{"id": "github-solacedev", "url": "https://maven.pkg.github.com/SolaceDev/*"}]'
      maven_settings_servers: '[{"id": "github-solacedev", "username": "${{ github.actor }}", "password": "${{ secrets.GITHUB_TOKEN }}"}]'
    secrets:
      FOSSA_API_KEY: ${{ secrets.FOSSA_API_KEY }}

  update_manifest:
    needs: sca_scan
    if: needs.sca_scan.result == 'success' && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      packages: read
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: arn:aws:iam::868978040651:role/github-solace-cloud-manifest-rw
          aws-region: us-east-1

      - name: Update solace-cloud-manifest
        uses: SolaceDev/solace-public-workflows/.github/actions/cicd-helper@main
        with:
          rc_step: add_item_from_json_to_dynamodb_table
          ddb_table_name: solace-cloud-manifest
          ddb_partition_key: squad
          ddb_sort_key: repository
          ddb_item_to_be_added: |
            {
              "squad": "connectors-core",
              "repository": "solace-spring-boot",
              "dev": {
                "sha": "${{ github.sha }}",
                "version": "${{ github.ref_name }}"
              }
            }
